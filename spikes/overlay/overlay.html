<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin:0; background:transparent; overflow:hidden; font-family: Inter, system-ui, sans-serif; user-select:none; }
  .peek { position:absolute; right:40px; bottom:-6px; width:150px; height:150px; animation: rise 1.1s cubic-bezier(.34,1.56,.64,1) both; }
  .peek svg { width:100%; height:100%; display:block; }
  @keyframes rise { 0% { transform: translateY(105%); } 70% { transform: translateY(-4%); } 100% { transform: translateY(0); } }
  .pupil { animation: look 3s ease-in-out 1.2s infinite; }
  @keyframes look { 0%,100% { transform: translate(0,0); } 40%,60% { transform: translate(-3px,-2px); } }
  .bubble { position:absolute; right:175px; bottom:120px; background:#fff; color:#1a1c26; border-radius:16px; padding:14px 16px 12px; width:230px;
            box-shadow:0 6px 18px rgba(0,0,0,.3); animation: pop .35s ease-out 1s both; }
  .bubble::after { content:""; position:absolute; right:-6px; bottom:22px; width:18px; height:18px; background:#fff; transform:rotate(45deg); border-radius:3px; }
  @keyframes pop { 0% { opacity:0; transform: scale(.6) translateY(10px); } 100% { opacity:1; transform: none; } }
  .hi { font-size:12px; color:#7a7f8f; margin-bottom:2px; }
  .who { font-size:15px; font-weight:600; } .who b { color:#e0663a; }
  .acts { display:flex; gap:8px; margin-top:12px; }
  .acts button { flex:1; font: 600 12px Inter, system-ui, sans-serif; padding:7px 0; border-radius:999px; border:0; cursor:pointer; }
  .yes { background:#1f9d55; color:#fff; } .no { background:#eef0f4; color:#3a3d4a; }
</style></head>
